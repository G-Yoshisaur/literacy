<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset='utf-8' />
  <meta name="viewport" content="width=device-width" />
  <title>スタイル</title>
  <style>
    strong {color:blue;}
    .blueviolet { color: blueviolet; }
    .red { color: red; }
    .bold {font-weight: bold;}
    .yabuki {color: gold; font-style: italic;}
  </style>
</head>

<body>
  <p>
    少年は古い地図を拾い、<strong>宝</strong>探しを始めた。
    <br>仲間と山奥へ進み、洞窟を発見した。
    <br><span class="bold">だが、</span><strong>宝</strong>箱は<strong class="blueviolet">空</strong>で、地図は<strong class="red">偽物</strong>だった。
    <br>それでも仲間との冒険が、<strong class="yabuki">一番の<strong>宝</strong></strong>になった。
  </p>
</body>

</html>
