<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表のサンプル</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>表のサンプル</h1>
    
    <table>
        <thead>
            <tr>
                <th>名前</th>
                <th>年齢</th>
                <th>職業</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>太郎</td>
                <td>25</td>
                <td>エンジニア</td>
            </tr>
            <tr>
                <td>花子</td>
                <td>28</td>
                <td>デザイナー</td>
            </tr>
            <tr>
                <td>次郎</td>
                <td>30</td>
                <td>プロジェクトマネージャー</td>
            </tr>
            <tr>
                <td>美咲</td>
                <td>26</td>
                <td>データアナリスト</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
